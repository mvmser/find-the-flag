[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The service worker and its manifest must always be revalidated so updates reach users
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets (JS, CSS, flag SVGs) never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old GitHub Pages path
[[redirects]]
  from = "/find-the-flag/*"
  to = "/:splat"
  status = 301
